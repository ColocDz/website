name: Build and Deploy to cPanel
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install
      - run: node scripts/package-cpanel.js


      - name: Deploy via HTTP (PHP)
        run: |
          curl -k -f --connect-timeout 30 --max-time 180 --resolve "colocdz.com:443:89.117.50.245" -X POST \
            -F "token=${{ secrets.DEPLOY_TOKEN }}" \
            -F "file=@deploy.tar.gz" \
            https://colocdz.com/deploy.php || \
          curl -k -f --connect-timeout 30 --max-time 180 --resolve "deploy.colocdz.com:443:89.117.50.245" -X POST \
            -F "token=${{ secrets.DEPLOY_TOKEN }}" \
            -F "file=@deploy.tar.gz" \
            https://deploy.colocdz.com/deploy.php

